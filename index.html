<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Photo Studio — JetPack</title>
</head>
<body>
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <main class="studio-shell">
    <section id="connection-banner" class="connection-banner glass-panel" hidden></section>

    <div class="studio-workspace">
      <!-- Left Column (1/3 Width): Thin Control Strip + Project Folder -->
      <div class="left-column">
        <!-- Thin Control Panel -->
        <section class="control-strip glass-panel" aria-label="Панель керування">
          <div class="control-strip-left">
            <div class="btn-group" role="group" aria-label="Дії запуску обробки">
              <button id="btn-process" class="btn btn-process-primary btn-icon" type="button" disabled title="Обробити поточний файл (Process)" aria-label="Обробити поточний файл">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polygon points="6 3 20 12 6 21 6 3" />
                </svg>
              </button>
              <button id="btn-process-all" class="btn btn-process-soft btn-icon" type="button" disabled title="Обробити всі вибрані файли (Process All)" aria-label="Обробити всі вибрані файли">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polygon points="5 4 15 12 5 20 5 4" />
                  <line x1="19" y1="5" x2="19" y2="19" />
                </svg>
              </button>
            </div>
            <div class="btn-group" role="group" aria-label="Пакетні дії з результатами">
              <button id="btn-restore-all" class="btn btn-ghost btn-icon" type="button" disabled title="Відновити всі оригінали (Restore All)" aria-label="Відновити всі">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="1 4 1 10 7 10" />
                  <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
                </svg>
              </button>
              <button id="btn-download-all" class="btn btn-primary btn-icon" type="button" disabled title="Скачати всі результати ZIP (Download All)" aria-label="Скачати всі">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                  <polyline points="7 10 12 15 17 10" />
                  <line x1="12" y1="15" x2="12" y2="3" />
                </svg>
              </button>
            </div>
          </div>
          <button id="btn-open-folder" class="btn btn-ghost btn-icon" type="button" disabled title="Відкрити папку проєкту (або скопіювати шлях для Finder Cmd+Shift+G)" aria-label="Відкрити папку проєкту">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2" />
            </svg>
          </button>
        </section>

        <!-- Left Panel: Virtual Project Folder -->
        <aside id="left-panel" class="left-panel glass-panel" aria-label="Робоча папка проєкту">
          <header class="panel-header">
            <div class="panel-title-wrap">
              <h1 class="panel-title">Project Folder</h1>
            </div>
            <div class="panel-header-actions">
              <div class="btn-group" role="group" aria-label="Режим відображення">
                <button id="btn-view-list" class="btn btn-ghost btn-icon-sm active" type="button" title="Список" aria-label="Режим списку" aria-pressed="true">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="8" y1="6" x2="21" y2="6" />
                    <line x1="8" y1="12" x2="21" y2="12" />
                    <line x1="8" y1="18" x2="21" y2="18" />
                    <line x1="3" y1="6" x2="3.01" y2="6" />
                    <line x1="3" y1="12" x2="3.01" y2="12" />
                    <line x1="3" y1="18" x2="3.01" y2="18" />
                  </svg>
                </button>
                <button id="btn-view-grid" class="btn btn-ghost btn-icon-sm" type="button" title="Плитки (3 в ряд)" aria-label="Режим плиток" aria-pressed="false">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="3" width="7" height="7" rx="1" />
                    <rect x="14" y="3" width="7" height="7" rx="1" />
                    <rect x="3" y="14" width="7" height="7" rx="1" />
                    <rect x="14" y="14" width="7" height="7" rx="1" />
                  </svg>
                </button>
              </div>
              <div class="btn-group" role="group" aria-label="Файли та виділення">
                <button id="btn-import-folder" class="btn btn-ghost btn-icon-sm" type="button" title="Імпортувати папку" aria-label="Імпортувати папку">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
                    <line x1="12" y1="11" x2="12" y2="17" />
                    <line x1="9" y1="14" x2="15" y2="14" />
                  </svg>
                </button>
                <button id="btn-select-cycle" class="btn btn-accent-soft btn-icon-sm" type="button" title="Вибрати файли (Select)" aria-label="Вибрати файли">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="9 11 12 14 22 4" />
                    <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
                  </svg>
                </button>
              </div>
            </div>
          </header>

          <input id="file-input-multi" type="file" multiple accept=".png,.jpg,.jpeg,.webp,.bmp,.tiff,image/*" hidden />
          <input id="file-input-folder" type="file" webkitdirectory multiple hidden />

          <div id="dropzone-area" class="dropzone-area" tabindex="0" role="region" aria-label="Перетягніть зображення або натисніть для вибору">
            <div id="file-list" class="file-list view-list"></div>
            <div id="empty-drop-hint" class="empty-drop-hint">
              <div class="drop-icon" aria-hidden="true">
                <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="4" />
                  <circle cx="8.5" cy="8.5" r="1.5" />
                  <path d="M21 15l-5-5L5 21" />
                </svg>
              </div>
              <div class="drop-title">Перетягніть зображення сюди</div>
              <div class="drop-subtitle">або натисніть по порожньому місцю (PNG, JPG, WEBP, BMP, TIFF)</div>
            </div>
          </div>

          <footer class="left-footer">
            <span id="workspace-summary" class="muted-meta">0 файлів</span>
            <button id="btn-add-files" class="btn btn-ghost btn-icon-sm" type="button" title="Додати зображення" aria-label="Додати зображення">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
            </button>
          </footer>

          <!-- Floating Version Management Popup (anchored over Project Folder) -->
          <div id="version-popup" class="version-popup glass-panel" hidden role="dialog" aria-modal="false" aria-label="Версії файлу"></div>
        </aside>
      </div>

      <!-- Right Panel: 2/3 Width Workspace -->
      <section class="right-panel">
        <!-- Secondary Control Panel (matches Control Panel height above Project Folder) -->
        <section class="secondary-control-strip glass-panel" aria-label="Додаткова панель керування">
          <div id="file-type-group" class="btn-group file-type-group" role="group" aria-label="Формат вихідного файлу">
            <button type="button" class="btn btn-file-type ext-auto active" data-output-format="auto" title="Автоматичний формат (як оригінал або .PNG для прозорості)" aria-pressed="true">AUTO</button>
            <button type="button" class="btn btn-file-type ext-png" data-output-format="png" title="Формат збереження .PNG" aria-pressed="false">.PNG</button>
            <button type="button" class="btn btn-file-type ext-jpg" data-output-format="jpg" title="Формат збереження .JPG" aria-pressed="false">.JPG</button>
            <button type="button" class="btn btn-file-type ext-webp" data-output-format="webp" title="Формат збереження .WEBP" aria-pressed="false">.WEBP</button>
          </div>
        </section>

        <!-- Compact Tabbed Toolbar -->
        <header class="toolbar glass-panel" aria-label="Інструменти обробки">
          <div id="tool-buttons" class="tool-tabs" role="tablist" aria-label="AI Інструменти">
            <button class="tool-tab active" data-tool="upscale" type="button" role="tab" aria-selected="true" title="Upscale (2x / 4x)">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
              <span>Upscale</span>
            </button>
            <button class="tool-tab" data-tool="enhance" type="button" role="tab" aria-selected="false" title="Enhance">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9L12 3z"/><path d="M5 19l1-2.5L8.5 15.5 6 14.5 5 12l-1 2.5L1.5 15.5 4 16.5 5 19z"/></svg>
              <span>Enhance</span>
            </button>
            <button class="tool-tab" data-tool="remove_bg" type="button" role="tab" aria-selected="false" title="Remove Background">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h6v6H4z"/><path d="M14 14h6v6h-6z"/><path d="M14 4h6v6h-6z" stroke-dasharray="2 2"/><path d="M4 14h6v6H4z" stroke-dasharray="2 2"/></svg>
              <span>Remove BG</span>
            </button>
            <button class="tool-tab" data-tool="blur_bg" type="button" role="tab" aria-selected="false" title="Blur Background">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="3.5"/><path d="M6.5 20a5.5 5.5 0 0 1 11 0"/><path d="M3 5h2M19 5h2M3 13h1.5M19.5 13H21" opacity="0.6"/></svg>
              <span>Blur BG</span>
            </button>
            <button class="tool-tab" data-tool="crop" type="button" role="tab" aria-selected="false" title="Crop">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>
              <span>Crop</span>
            </button>
            <button class="tool-tab" data-tool="resize" type="button" role="tab" aria-selected="false" title="Resize">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M9 12h6M12 9v6"/></svg>
              <span>Resize</span>
            </button>
          </div>

          <div class="toolbar-body">
            <div id="tool-options" class="tool-options" role="tabpanel"></div>
          </div>
        </header>

        <!-- Preview Canvas -->
        <div id="preview-stage" class="preview-stage glass-panel">
          <div id="canvas-viewport" class="canvas-viewport">
            <div id="canvas-content" class="canvas-content"></div>
          </div>

          <!-- Per-image Download / Restore Overlay (when processed) -->
          <div id="image-overlay-actions" class="image-overlay-actions btn-group" hidden>
            <button id="btn-img-download" class="btn btn-overlay btn-icon-sm" type="button" title="Скачати результат" aria-label="Скачати результат">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />
              </svg>
            </button>
            <button id="btn-img-restore" class="btn btn-overlay btn-icon-sm" type="button" title="Відновити оригінал (Restore)" aria-label="Відновити оригінал">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="1 4 1 10 7 10" />
                <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
              </svg>
            </button>
          </div>

          <!-- Bottom-Right Zoom Controls & Conditional Minimap Navigator -->
          <div id="canvas-hud" class="canvas-hud" hidden>
            <div id="canvas-minimap" class="canvas-minimap glass-panel" hidden title="Навігатор видимої області (перетягніть або клікніть)">
              <img id="minimap-img" alt="Мінімапа" draggable="false" />
              <div id="minimap-viewport-rect" class="minimap-viewport-rect"></div>
            </div>
            <div class="zoom-bar">
              <span id="zoom-percent-readout" class="zoom-readout">100%</span>
              <div class="btn-group" role="group" aria-label="Масштаб зображення">
                <button id="btn-zoom-out" class="btn btn-overlay btn-icon-sm" type="button" title="Зменшити масштаб" aria-label="Зменшити масштаб">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    <line x1="8" y1="11" x2="14" y2="11" />
                  </svg>
                </button>
                <button id="btn-zoom-reset" class="btn btn-overlay btn-icon-sm" type="button" title="Розгорнути на всю робочу область (Fit)" aria-label="Розгорнути на всю робочу область">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" />
                  </svg>
                </button>
                <button id="btn-zoom-100" class="btn btn-overlay btn-icon-sm" type="button" title="Оригінальний розмір (100% / 1:1)" aria-label="Оригінальний розмір 100%">
                  <svg width="18" height="14" viewBox="0 0 24 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M4 4l2-1v10" />
                    <path d="M12 5.5h.01" />
                    <path d="M12 10.5h.01" />
                    <path d="M18 4l2-1v10" />
                  </svg>
                </button>
                <button id="btn-zoom-in" class="btn btn-overlay btn-icon-sm" type="button" title="Збільшити масштаб" aria-label="Збільшити масштаб">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    <line x1="11" y1="8" x2="11" y2="14" />
                    <line x1="8" y1="11" x2="14" y2="11" />
                  </svg>
                </button>
              </div>
            </div>
          </div>

          <div id="progress-overlay" class="progress-overlay" hidden>
            <div class="progress-card glass-panel">
              <div class="progress-head">
                <span id="progress-title">Processing...</span>
                <span id="progress-percent">0%</span>
              </div>
              <div class="progress-track">
                <div id="progress-bar" class="progress-fill" style="width: 0%;"></div>
              </div>
              <div id="progress-sub" class="progress-sub">Preparing worker...</div>
            </div>
          </div>
        </div>

        <!-- Bottom-Right Status Footer -->
        <footer class="workspace-footer">
          <div id="status-line" class="status-line muted-meta">Готово до роботи</div>
        </footer>
      </section>
    </div>
  </main>

  <!-- Right-Click Translucent File Details Popover -->
  <div id="file-info-popover" class="file-info-popover" hidden role="dialog" aria-label="Деталі файлу"></div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
